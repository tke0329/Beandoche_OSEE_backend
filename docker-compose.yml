name: osee

services:
  postgres:
    image: postgres:17-alpine
    container_name: osee-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: osee
      POSTGRES_USER: ${DB_USERNAME:-osee}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-osee-local-password}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - osee-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

volumes:
  osee-postgres-data:
